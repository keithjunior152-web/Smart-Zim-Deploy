<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a6b3c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>You're Offline — SmartZim</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #1a6b3c;
      --green-dark: #145630;
      --green-light:#e8f5ee;
      --cream:      #fdf6ec;
      --amber:      #d97706;
      --amber-dark: #b45309;
      --text:       #1c2b22;
      --muted:      #6b7c72;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border: 1px solid #e2ede8;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(26,107,60,.08);
    }

    /* ── Logo ── */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo img {
      width: 36px;
      height: 36px;
    }
    .logo-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: -0.3px;
    }

    /* ── Icon ── */
    .icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: var(--green-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrap svg {
      width: 40px;
      height: 40px;
      color: var(--green);
    }

    /* ── Text ── */
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .tip {
      font-size: 13px;
      color: var(--muted);
      background: var(--green-light);
      border-radius: 10px;
      padding: 12px 16px;
      margin: 20px 0 28px;
      line-height: 1.5;
    }
    .tip strong { color: var(--green); }

    /* ── Buttons ── */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 24px;
      background: var(--amber);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-primary:hover  { background: var(--amber-dark); }
    .btn-primary:active { transform: scale(.98); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 24px;
      background: transparent;
      color: var(--green);
      font-size: 15px;
      font-weight: 600;
      border: 1.5px solid var(--green);
      border-radius: 12px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      text-decoration: none;
    }
    .btn-secondary:hover  { background: var(--green-light); }
    .btn-secondary:active { transform: scale(.98); }

    /* ── Status dot ── */
    .status {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 16px;
    }
    .status.visible { display: flex; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .dot.online { background: #22c55e; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .7s linear infinite; display: inline-block; }

    /* ── Footer ── */
    footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: var(--green); text-decoration: none; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Logo -->
    <div class="logo">
      <img src="/favicon.svg" alt="SmartZim icon" onerror="this.style.display='none'" />
      <span class="logo-text">SmartZim</span>
    </div>

    <!-- Wifi-off icon -->
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>No internet connection detected. Check your network and try again.</p>

    <div class="tip">
      💡 <strong>Good news:</strong> pages you've already visited are saved for offline reading. Your study progress is safe.
    </div>

    <button class="btn-primary" id="retryBtn" onclick="retryConnection()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" id="retryIcon">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Try Again
    </button>

    <a class="btn-secondary" href="/">Go to Home</a>

    <div class="status" id="statusLine">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Checking connection…</span>
    </div>
  </div>

  <footer>
    <a href="/">SmartZim</a> · ZIMSEC &amp; Cambridge Exam Prep
  </footer>

  <script>
    let checking = false;

    function retryConnection() {
      if (checking) return;
      checking = true;

      const btn  = document.getElementById('retryBtn');
      const icon = document.getElementById('retryIcon');
      const status = document.getElementById('statusLine');
      const dot    = document.getElementById('statusDot');
      const text   = document.getElementById('statusText');

      btn.disabled = true;
      icon.classList.add('spin');
      status.classList.add('visible');
      dot.className = 'dot';
      text.textContent = 'Checking connection…';

      // Ping the API health endpoint — small, no-cache, same origin
      fetch('/api/healthz', { method: 'GET', cache: 'no-store' })
        .then(r => {
          if (r.ok) {
            dot.classList.add('online');
            text.textContent = 'Back online! Reloading…';
            setTimeout(() => {
              // Go back to the page they were trying to reach, or home
              const dest = document.referrer && document.referrer !== window.location.href
                ? document.referrer
                : '/';
              window.location.href = dest;
            }, 600);
          } else {
            showOffline(dot, text);
          }
        })
        .catch(() => showOffline(dot, text))
        .finally(() => {
          btn.disabled = false;
          icon.classList.remove('spin');
          checking = false;
        });
    }

    function showOffline(dot, text) {
      dot.className = 'dot';
      text.textContent = 'Still offline. Try again shortly.';
    }

    // Auto-retry when the browser fires the online event
    window.addEventListener('online', () => retryConnection());

    // Show the status line on load so users know where they stand
    window.addEventListener('DOMContentLoaded', () => {
      if (!navigator.onLine) {
        const s = document.getElementById('statusLine');
        s.classList.add('visible');
        document.getElementById('statusText').textContent = 'No network detected';
      }
    });
  </script>
</body>
</html>
