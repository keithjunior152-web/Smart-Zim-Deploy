components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        grade: { type: ["string", "null"] }
        curriculum: { type: string }
        subjects:
          type: array
          items: { type: string }
        school: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        status: { type: string }
        subscriptionStatus: { type: string }
        subscriptionExpiry: { type: ["string", "null"], format: date-time }
        trialStartDate: { type: ["string", "null"], format: date-time }
        referralCode: { type: ["string", "null"] }
        profilePhotoUrl: { type: ["string", "null"] }
        coverPhotoUrl: { type: ["string", "null"] }
        studyStreak: { type: integer }
        totalStudyMinutes: { type: integer }
        rejectionReason: { type: ["string", "null"] }
        isSuperAdmin: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: ["string", "null"], format: date-time }
      required:
        - id
        - name
        - email
        - role
        - status
        - subscriptionStatus
        - studyStreak
        - totalStudyMinutes
        - isSuperAdmin
        - createdAt

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]

    RegisterUserInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        role: { type: string }
        grade: { type: ["string", "null"] }
        curriculum: { type: ["string", "null"] }
        subjects:
          type: array
          items: { type: string }
        school: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        referralCode: { type: ["string", "null"] }
      required: [name, email, password, role]

    LoginInput:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]

    ChangePasswordInput:
      type: object
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }
      required: [currentPassword, newPassword]

    MessageResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]

    UpdateUserInput:
      type: object
      properties:
        name: { type: ["string", "null"] }
        grade: { type: ["string", "null"] }
        curriculum: { type: ["string", "null"] }
        subjects:
          type: array
          items: { type: string }
        school: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        profilePhotoUrl: { type: ["string", "null"] }
        coverPhotoUrl: { type: ["string", "null"] }

    RejectUserInput:
      type: object
      properties:
        reason: { type: string }
      required: [reason]

    GrantSubscriptionInput:
      type: object
      properties:
        expiryDate: { type: string, format: date-time }
        plan: { type: string }
      required: [expiryDate, plan]

    LeaderboardEntry:
      type: object
      properties:
        userId: { type: integer }
        name: { type: string }
        grade: { type: ["string", "null"] }
        school: { type: ["string", "null"] }
        score: { type: integer }
        examsCompleted: { type: integer }
      required: [userId, name, score, examsCompleted]

    Note:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        subject: { type: string }
        curriculum: { type: string }
        level: { type: string }
        grade: { type: string }
        topic: { type: string }
        chapterNumber: { type: ["integer", "null"] }
        content: { type: string }
        fileUrl: { type: ["string", "null"] }
        teacherId: { type: ["integer", "null"] }
        teacherName: { type: ["string", "null"] }
        downloads: { type: integer }
        bookmarks: { type: integer }
        featured: { type: boolean }
        status: { type: string }
        readMinutes: { type: integer }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - title
        - subject
        - level
        - grade
        - topic
        - content
        - downloads
        - bookmarks
        - featured
        - status
        - readMinutes
        - createdAt

    CreateNoteInput:
      type: object
      properties:
        title: { type: string }
        subject: { type: string }
        curriculum: { type: ["string", "null"] }
        level: { type: string }
        grade: { type: string }
        topic: { type: string }
        chapterNumber: { type: ["integer", "null"] }
        content: { type: string }
        fileUrl: { type: ["string", "null"] }
        status: { type: string }
      required: [title, subject, level, grade, topic, content]

    UpdateNoteInput:
      type: object
      properties:
        title: { type: ["string", "null"] }
        content: { type: ["string", "null"] }
        topic: { type: ["string", "null"] }
        featured: { type: ["boolean", "null"] }
        status: { type: ["string", "null"] }

    Paper:
      type: object
      properties:
        id: { type: integer }
        examBoard: { type: string }
        curriculum: { type: string }
        subject: { type: string }
        paperCode: { type: ["string", "null"] }
        level: { type: string }
        grade: { type: ["string", "null"] }
